# Builds the API container image and publishes it to GitHub's container registry (free for public repositories).
# The image holds the CODE only. The built data (derived from FBR documents) is downloaded by deploy/start.py when the container starts.
# Any host can run it: ghcr.io/maaz5711/customs-copilot-api:latest (Azure Container Apps, Cloud Run, Koyeb, a VM).
name: Build API image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "src/**"
      - "deploy/**"
      - "data/ground_truth/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/maaz5711/customs-copilot-api:latest
